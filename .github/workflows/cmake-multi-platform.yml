name: CI

on:
  push:
    branches: ["main", "devel", "devel-qt"]
  pull_request:
    branches: ["main", "devel", "devel-qt"]

permissions:
  contents: read

env:
  APPIMAGE_EXTRACT_AND_RUN: "1"
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
  VCPKG_INSTALL_OPTIONS: --debug
  VCPKG_COMMIT: 62159a45e18f3a9ac0548628dcaf74fcb60c6ff9

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_version: 6.10.2
            artifact_name: Sessio-linux-appimage
            qt_component: qt.qt6.6102.linux_gcc_64
          - os: macos-latest
            qt_version: 6.10.2
            qt_arch: clang_64
            artifact_name: Sessio-macos-dmg
            qt_host: mac
            qt_target: desktop
          - os: windows-2022
            qt_version: 6.10.2
            qt_arch: win64_msvc2022_64
            artifact_name: Sessio-windows-installer
            qt_host: windows
            qt_target: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            patchelf \
            rpm \
            file \
            wget \
            curl \
            libfuse2 \
            libgl1-mesa-dev \
            libglx-mesa0 \
            mesa-common-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxrender-dev \
            libxi-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libsecret-1-dev \
            libwayland-client0 \
            libwayland-cursor0 \
            libwayland-egl1 \
            libxkbcommon0 \
            libdbus-1-3

      - name: Restore Qt cache (Linux)
        if: runner.os == 'Linux'
        id: cache-qt-linux
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/Qt/${{ matrix.qt_version }}/gcc_64
          key: ${{ runner.os }}-qt-${{ matrix.qt_version }}-gcc_64

      - name: Install Qt (Windows)
        if: runner.os == 'Windows' || runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.3.*'
          version: ${{ matrix.qt_version }}
          host: ${{ matrix.qt_host }}
          target: ${{ matrix.qt_target }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Export Qt environment (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool
          echo "Qt6_DIR=${QT_ROOT_DIR}/lib/cmake/Qt6" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "${QT_ROOT_DIR}/bin" >> "$GITHUB_PATH"

      - name: Install Qt (Linux official installer)
        if: runner.os == 'Linux' && steps.cache-qt-linux.outputs.cache-hit != 'true'
        env:
          QT_EMAIL: ${{ secrets.QT_EMAIL }}
          QT_PW: ${{ secrets.QT_PW }}
        run: |
          curl -L -O https://download.qt.io/official_releases/online_installers/qt-online-installer-linux-x64-online.run
          chmod +x qt-online-installer-linux-x64-online.run
          ./qt-online-installer-linux-x64-online.run \
            --root "${{ github.workspace }}/Qt" \
            --accept-licenses \
            --accept-obligations \
            --default-answer \
            --confirm-command \
            --email "$QT_EMAIL" \
            --pw "$QT_PW" \
            --auto-answer "OperationDoesNotExistError=Ignore,OverwriteTargetDirectory=No,stopProcessesForUpdates=Ignore,installationErrorWithCancel=Ignore,installationErrorWithIgnore=Ignore,AssociateCommonFiletypes=No,telemetry-question=No" \
            install "${{ matrix.qt_component }}"

      - name: Export Qt environment (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Qt6_DIR=${{ github.workspace }}/Qt/${{ matrix.qt_version }}/gcc_64/lib/cmake/Qt6" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${{ github.workspace }}/Qt/${{ matrix.qt_version }}/gcc_64${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "${{ github.workspace }}/Qt/${{ matrix.qt_version }}/gcc_64/bin" >> "$GITHUB_PATH"

      - name: Save Qt cache (Linux)
        if: runner.os == 'Linux' && steps.cache-qt-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/Qt/${{ matrix.qt_version }}/gcc_64
          key: ${{ steps.cache-qt-linux.outputs.cache-primary-key }}

      - name: Restore vcpkg binary cache
        id: cache-vcpkg-binary
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: ${{ runner.os }}-vcpkg-bincache-${{ hashFiles('vcpkg.json') }}

      - name: Restore vcpkg installed tree
        id: cache-vcpkg-installed
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/build-release/vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Prepare vcpkg cache directories
        if: runner.os != 'Windows'
        run: |
          mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"
          mkdir -p "${VCPKG_DOWNLOADS}"

      - name: Prepare vcpkg cache directories (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null

      - name: Bootstrap vcpkg (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ ! -d "${{ github.workspace }}/vcpkg/.git" ]; then
            git clone https://github.com/microsoft/vcpkg "${{ github.workspace }}/vcpkg"
          fi
          git -C "${{ github.workspace }}/vcpkg" fetch --depth 1 origin "${VCPKG_COMMIT}"
          git -C "${{ github.workspace }}/vcpkg" checkout --force "${VCPKG_COMMIT}"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${{ github.workspace }}/vcpkg/.git")) {
            git clone https://github.com/microsoft/vcpkg "${{ github.workspace }}/vcpkg"
          }
          git -C "${{ github.workspace }}/vcpkg" fetch --depth 1 origin "$env:VCPKG_COMMIT"
          git -C "${{ github.workspace }}/vcpkg" checkout --force "$env:VCPKG_COMMIT"
          & "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=${{ github.workspace }}/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset vcpkg-release

      - name: Save vcpkg binary cache
        if: steps.cache-vcpkg-binary.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: ${{ steps.cache-vcpkg-binary.outputs.cache-primary-key }}

      - name: Save vcpkg installed tree
        if: steps.cache-vcpkg-installed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/build-release/vcpkg_installed
          key: ${{ steps.cache-vcpkg-installed.outputs.cache-primary-key }}

      - name: Check translations are up to date
        if: runner.os == 'Linux'
        run: |
          cmake --build build-release --target update_translations
          git diff --exit-code -- translation/app_ru.ts translation/app_en.ts
          if grep -q 'type="unfinished"' translation/app_ru.ts translation/app_en.ts; then
            echo "::error::Untranslated entries remain in translation/*.ts"
            grep -n 'type="unfinished"' translation/app_ru.ts translation/app_en.ts
            exit 1
          fi

      - name: Build
        run: cmake --build build-release --parallel

      - name: Configure LiveKit spike
        continue-on-error: true
        run: cmake -S spikes/livekit-cpp-spike -B spike-build

      - name: Build LiveKit spike
        continue-on-error: true
        run: cmake --build spike-build --parallel

      - name: Install bundle
        if: runner.os != 'Windows'
        run: cmake --install build-release --config MinSizeRel --prefix "${{ github.workspace }}/build-release/install"

      - name: Prepare Windows deploy directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-release/packages/Sessio | Out-Null
          Copy-Item build-release/Sessio.exe build-release/packages/Sessio/
          $keychainDll = Get-ChildItem build-release/_deps/qtkeychain-build -Recurse -Filter qt6keychain.dll |
            Select-Object -First 1
          if ($null -eq $keychainDll) {
            throw "qt6keychain.dll was not built"
          }
          Copy-Item $keychainDll.FullName (Join-Path $env:QT_ROOT_DIR "bin") -Force
          Copy-Item $keychainDll.FullName build-release/packages/Sessio/ -Force

      - name: Run windeployqt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtBin = Join-Path $env:QT_ROOT_DIR "bin"
          & (Join-Path $qtBin "windeployqt.exe") `
            --release `
            --svg `
            --no-translations `
            --dir build-release/packages/Sessio `
            build-release/packages/Sessio/Sessio.exe

      - name: Copy vcpkg runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item `
            -Path build-release/vcpkg_installed/x64-windows/bin/*.dll `
            -Destination build-release/packages/Sessio `
            -Force

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ matrix.qt_version }}" `
            "/DMySourceDir=${{ github.workspace }}\build-release\packages\Sessio" `
            "/DMyOutputDir=${{ github.workspace }}\build-release\packages" `
            "/DMyIconFile=${{ github.workspace }}\resources\icons\Sessio.ico" `
            "${{ github.workspace }}\packaging\Sessio.iss"

      - name: Download linuxdeployqt
        if: runner.os == 'Linux'
        run: |
          mkdir -p build-release/tools
          cd build-release/tools
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p "${{ github.workspace }}/build-release/AppDir"
          cmake --install build-release --config MinSizeRel --prefix "${{ github.workspace }}/build-release/AppDir/usr"
          QT_PREFIX="${{ github.workspace }}/Qt/${{ matrix.qt_version }}/gcc_64"
          export PATH="$QT_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$QT_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          mkdir -p build-release/AppDir/usr/plugins/platforms
          cp -av "$QT_PREFIX/plugins/platforms/libqwayland.so" build-release/AppDir/usr/plugins/platforms/ || true
          cp -av "$QT_PREFIX/plugins/platforms/libqxcb.so" build-release/AppDir/usr/plugins/platforms/ || true
          build-release/tools/linuxdeploy-x86_64.AppImage \
            --appdir build-release/AppDir \
            --executable build-release/AppDir/usr/bin/Sessio \
            --desktop-file build-release/AppDir/usr/share/applications/Sessio.desktop \
            --icon-file build-release/AppDir/usr/share/icons/hicolor/scalable/apps/Sessio.svg \
            --plugin qt \
            --output appimage
          mkdir -p build-release/packages
          find . -maxdepth 1 -type f -name '*.AppImage' ! -name 'linuxdeploy*.AppImage' -exec mv {} build-release/packages/ \;

      - name: Build RPM package
        if: runner.os == 'Linux'
        run: |
          cpack --config build-release/CPackConfig.cmake --generator RPM --verbose
          rpm -qip build-release/packages/*.rpm
          rpm -qlp build-release/packages/*.rpm

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build-release/packages/*
          if-no-files-found: error

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p build-release/packages
          APP_BUNDLE="${{ github.workspace }}/build-release/install/Sessio.app"
          macdeployqt "$APP_BUNDLE" -always-overwrite

          test -d "$APP_BUNDLE/Contents/Frameworks/QtCore.framework"
          test -d "$APP_BUNDLE/Contents/Frameworks/QtGui.framework"
          test -d "$APP_BUNDLE/Contents/Frameworks/QtWidgets.framework"
          test -d "$APP_BUNDLE/Contents/PlugIns/platforms"
          test -f "$APP_BUNDLE/Contents/PlugIns/platforms/libqcocoa.dylib"

          du -sh "$APP_BUNDLE"
          du -sh "$APP_BUNDLE/Contents/Frameworks"
          find "$APP_BUNDLE/Contents/Frameworks" -maxdepth 1 -mindepth 1 | sort
          find "$APP_BUNDLE/Contents/PlugIns" -maxdepth 2 -type f | sort
          otool -L "$APP_BUNDLE/Contents/MacOS/Sessio"

          codesign --force --deep --sign - "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          hdiutil create \
            -volname "Sessio" \
            -srcfolder "$APP_BUNDLE" \
            -ov \
            -format UDZO \
            build-release/packages/Sessio-macos.dmg

      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build-release/packages/*.dmg
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build-release/packages/Sessio-windows-setup.exe
          if-no-files-found: error

  publish:
    name: Publish Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        run: |
          APP_VERSION="$(sed -n 's/.*project([^)]*VERSION \([0-9.]\+\).*/\1/p' CMakeLists.txt | head -n 1)"
          if [ -z "$APP_VERSION" ]; then
            echo "Failed to read app version from CMakeLists.txt" >&2
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$APP_VERSION" >> "$GITHUB_ENV"

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Sessio-linux-appimage
          path: release/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Sessio-macos-dmg
          path: release/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Sessio-windows-installer
          path: release/windows

      - name: Normalize release asset names
        run: |
          mkdir -p release/assets
          find release/linux -type f -name '*.AppImage' -exec cp {} "release/assets/Sessio-${APP_VERSION}-linux.AppImage" \;
          find release/linux -type f -name '*.rpm' -exec cp {} "release/assets/Sessio-${APP_VERSION}-linux.rpm" \;
          find release/macos -type f -name '*.dmg' -exec cp {} "release/assets/Sessio-${APP_VERSION}-macos.dmg" \;
          find release/windows -type f -name '*.exe' -exec cp {} "release/assets/Sessio-${APP_VERSION}-windows-setup.exe" \;
          ls -lah release/assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Sessio $APP_VERSION" \
              --generate-notes
          gh release upload "$RELEASE_TAG" release/assets/* --clobber
