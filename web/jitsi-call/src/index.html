<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sessio call</title>
  <link rel="stylesheet" href="./styles.css">
  <!-- C++ may call window.sessioCall right after load; calls made before app.js
       is ready are queued here and replayed by it. -->
  <script>
    (function () {
      var queue = (window.__sessioCallQueue = []);
      window.sessioCall = {};
      ['join', 'leave', 'setMicrophoneEnabled', 'setCameraEnabled', 'setAudioCapture', 'reconnectAudio'].forEach(function (name) {
        window.sessioCall[name] = function () { queue.push([name, Array.prototype.slice.call(arguments)]); };
      });
    })();
  </script>
  <script src="sessio-call://app/qwebchannel.js"></script>
</head>
<body>
  <div id="app">
    <div id="status"></div>
    <div id="grid"></div>
    <div id="controls">
      <button id="mic" aria-pressed="true"></button>
      <button id="cam" aria-pressed="true"></button>
      <button id="leave" class="leave"></button>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
