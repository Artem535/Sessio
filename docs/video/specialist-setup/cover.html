<!doctype html><meta charset="utf-8"><title>Cover</title>
<style>
@font-face{font-family:S;src:url(assets/fonts/NotoSans-Bold.ttf);font-weight:700}
@font-face{font-family:S;src:url(assets/fonts/NotoSans-ExtraBold.ttf);font-weight:800}
@font-face{font-family:S;src:url(assets/fonts/NotoSans-Regular.ttf);font-weight:400}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0b0c10;font-family:S,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 20%,#2a3a78,transparent 60%),radial-gradient(ellipse at 90% 90%,#3a2a78,transparent 55%),#0f1118}
.logo{position:absolute;left:80px;top:64px;display:flex;align-items:center;gap:16px;font-size:34px;font-weight:700;color:#cfd6f0}
.logo i{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#8b7bff,#5a4be0)}
h1{position:absolute;left:80px;top:220px;width:700px;margin:0;font-size:78px;line-height:1.08;font-weight:800;letter-spacing:-1px}
p{position:absolute;left:80px;bottom:76px;margin:0;font-size:28px;color:#b9c6ee}
.card{position:absolute;right:70px;top:110px;width:430px;border-radius:18px;background:#1f2127;border:1px solid #40485a;box-shadow:0 30px 80px #000a;padding:26px}
.card .r{height:30px;border-radius:8px;background:#282b33;margin-bottom:14px}
.card .r.s{width:60%}.card .b{display:inline-block;height:34px;width:120px;border-radius:8px;background:#5086ff;margin-top:6px}
.card .lk{height:30px;border-radius:15px;background:#2a4a8f;width:80%;margin:6px 0 16px}
.tile{position:absolute;right:130px;top:430px;width:300px;height:170px;border-radius:14px;background:radial-gradient(ellipse at 50% 30%,#3a4260,#161a28);border:2px solid #3c4560;box-shadow:0 20px 50px #000a}
.tile:before{content:"";position:absolute;left:50%;top:26px;width:62px;height:62px;margin-left:-31px;border-radius:50%;background:#9fb2e8}
.tile:after{content:"";position:absolute;left:50%;top:96px;width:140px;height:90px;margin-left:-70px;border-radius:70px 70px 0 0;background:#7e93d4}
</style>
<div class="bg"></div><div class="logo"><i></i>Sessio</div>
<h1>Как настроить видеозвонки в Sessio</h1>
<p>Для специалиста · около 4 минут</p>
<div class="card"><div class="r"></div><div class="r s"></div><div class="lk"></div><div class="r"></div><div class="b"></div></div>
<div class="tile"></div>
