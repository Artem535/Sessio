sonar.projectKey=Artem535_PsyClientManager
sonar.organization=artem535

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=PsyClientManager
sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# cpp:S956 ("expected FILENAME or <FILENAME>") false-positives on oatpp's
# codegen include-guard macros (`#include OATPP_CODEGEN_BEGIN(DTO)` /
# `OATPP_CODEGEN_END(DTO)`): the CFamily analyzer can't resolve a macro-
# expanded #include target, even though it's valid C++ (the macro expands
# to a real filename at preprocessing time) and is oatpp's documented DTO
# pattern, used throughout token-backend's controller/DTO headers.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S956
sonar.issue.ignore.multicriteria.e1.resourceKey=token-backend/src/controller/*.h
